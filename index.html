<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mutsify</title>
<meta name="description" content="Drop a photo and get a funny Christmas version, with a Santa hat on every head.">
<link rel="icon" href="assets/icon.jpg">
<link rel="apple-touch-icon" href="assets/icon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Parisienne&display=swap" rel="stylesheet">
<style>
  :root {
    --tint: 47, 106, 160;           /* changed by the colour dots */
    --glass: rgba(255,255,255,.16);
    --edge: rgba(255,255,255,.38);
    --ink: #fff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: -apple-system, "SF Pro Display", "Inter", system-ui, sans-serif; color: var(--ink);
    background: #9cc3dc; overflow-x: hidden; -webkit-font-smoothing: antialiased;
  }
  /* soft, blurry photo of fluffy reindeer behind everything */
  .bg { position: fixed; inset: -24px; z-index: 0; background: url("assets/background.jpg") center / cover no-repeat; filter: blur(5px) saturate(1.05); }
  .tint { position: fixed; inset: 0; z-index: 0; background: rgba(var(--tint), .28); transition: background .6s; }

  /* plush snowflakes drifting down the whole time */
  .snow { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .flake { position: absolute; top: 0; left: var(--x); width: var(--size); animation: fall var(--fall) linear infinite; animation-delay: var(--delay); will-change: transform; }
  .flake span { display: block; animation: sway var(--sway) ease-in-out infinite alternate; }
  .flake img { display: block; width: 100%; filter: blur(var(--blur)) drop-shadow(0 6px 8px rgba(0,0,0,.12)); opacity: var(--alpha); animation: twirl var(--twirl) linear infinite; }
  @keyframes fall { from { transform: translateY(-20vh); } to { transform: translateY(115vh); } }
  @keyframes sway { from { transform: translateX(calc(var(--drift) * -1)); } to { transform: translateX(var(--drift)); } }
  @keyframes twirl { to { transform: rotate(var(--turn)); } }
  @media (prefers-reduced-motion: reduce) { .snow { display: none; } }

  main { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 44px 16px 56px; text-align: center; }
  .icon { width: 72px; height: 72px; border-radius: 18px; display: block; margin: 0 auto 14px; box-shadow: 0 8px 22px rgba(0,0,0,.18); animation: nod 3.5s ease-in-out infinite; }
  @keyframes nod { 50% { transform: rotate(-5deg) translateY(-2px); } }
  h1 { margin: 0 0 28px; font-size: clamp(1.8rem, 5vw, 2.3rem); font-weight: 700; letter-spacing: -.01em; text-shadow: 0 2px 14px rgba(0,0,0,.12); }
  h1 sup { font-size: .45em; font-weight: 600; vertical-align: super; }

  .glass {
    background: var(--glass); border: 1px solid var(--edge); border-radius: 30px;
    backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2);
    box-shadow: 0 10px 40px rgba(0,0,0,.10), inset 0 1px 0 rgba(255,255,255,.35);
  }

  .stage { padding: 14px; }
  .drop {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    min-height: 300px; border-radius: 20px; cursor: pointer; font-size: 1.35rem; font-weight: 600;
    transition: background .25s;
  }
  .drop:hover, .drop.over { background: rgba(255,255,255,.12); }
  .drop svg { width: 64px; height: 64px; opacity: .92; transition: transform .3s cubic-bezier(.34,1.56,.64,1); }
  .drop:hover svg, .drop.over svg { transform: scale(1.12) rotate(-6deg); }
  .drop small { font-size: .9rem; font-weight: 400; opacity: .8; }
  .drop input { display: none; }
  body.has-photo .drop { display: none; }

  .frame { position: relative; display: none; border-radius: 20px; line-height: 0;
    background: radial-gradient(circle, rgba(255,255,255,.55) 1.2px, transparent 1.8px) 0 0 / 22px 22px, rgba(255,255,255,.12); }
  body.has-photo .frame { display: block; }
  .frame > img, .frame > canvas { display: block; width: 100%; height: auto; border-radius: 20px; }
  .frame > .layer { position: absolute; inset: 0; width: 100%; height: 100%; }
  #funnyImg { opacity: 0; transform: scale(.94); transition: opacity .6s, transform .7s cubic-bezier(.34,1.56,.64,1); }
  #funnyImg.show { opacity: 1; transform: none; }

  .toolbar { display: inline-flex; gap: 6px; margin-top: 28px; padding: 8px 12px; border-radius: 999px; }
  .tool {
    width: 48px; height: 44px; border: 0; border-radius: 999px; background: transparent; color: #fff; cursor: pointer;
    display: grid; place-items: center; transition: background .2s, transform .2s cubic-bezier(.34,1.56,.64,1), opacity .2s;
  }
  .tool svg { width: 22px; height: 22px; }
  .tool:hover:not(:disabled) { background: rgba(255,255,255,.22); transform: translateY(-1px); }
  .tool:active:not(:disabled) { transform: scale(.92); }
  .tool:disabled { opacity: .38; cursor: default; }
  .tool.spin svg { animation: spin 1.4s linear infinite; }
  @keyframes spin { to { transform: rotate(-360deg); } }

  .dots { display: flex; justify-content: center; gap: 14px; margin-top: 30px; }
  .dot { width: 20px; height: 20px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; background: var(--c);
    box-shadow: 0 2px 6px rgba(0,0,0,.15); transition: transform .2s cubic-bezier(.34,1.56,.64,1); }
  .dot:hover { transform: scale(1.18); }
  .dot.on { box-shadow: 0 0 0 3px rgba(255,255,255,.75), 0 2px 6px rgba(0,0,0,.15); }
  .tagline { font-family: "Parisienne", cursive; font-size: 1.7rem; margin-top: 14px; opacity: .95; text-shadow: 0 1px 10px rgba(0,0,0,.12); }

  /* the fluffy reindeer that eats your photo */
  #reindeer { position: absolute; z-index: 5; pointer-events: none; display: none; }
  #reindeer img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 10px 10px rgba(0,0,0,.28)); transform-origin: 50% 100%; }
  #reindeer.left img { transform: scaleX(-1); }
  #reindeer.walking img { animation: hop .34s ease-in-out infinite alternate; }
  #reindeer.left.walking img { animation-name: hop-left; }
  @keyframes hop { from { transform: translateY(0) rotate(-2deg); } to { transform: translateY(-7%) rotate(3deg); } }
  @keyframes hop-left { from { transform: scaleX(-1) translateY(0) rotate(-2deg); } to { transform: scaleX(-1) translateY(-7%) rotate(3deg); } }
  #reindeer.chomp img { animation: munch .24s ease-in-out 2; }
  #reindeer.left.chomp img { animation-name: munch-left; }
  @keyframes munch { 50% { transform: scale(1.04, .94) rotate(4deg); } }
  @keyframes munch-left { 0%, 100% { transform: scaleX(-1); } 50% { transform: scaleX(-1) scale(1.04, .94) rotate(4deg); } }

  .bubble {
    position: absolute; z-index: 6; padding: 7px 13px; border-radius: 16px; line-height: 1.2; white-space: nowrap;
    background: rgba(255,255,255,.9); color: #1f3550; font-size: 1rem; font-weight: 600;
    box-shadow: 0 6px 18px rgba(0,0,0,.15); transform: translate(-50%, -100%) scale(0);
    animation: pop .28s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes pop { to { transform: translate(-50%, -100%) scale(1); } }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 20; padding: 12px 18px;
    border-radius: 16px; font-size: .98rem; display: none; color: #fff; }
  .toast.show { display: block; }

  @media (max-width: 520px) {
    main { padding-top: 32px; }
    .drop { min-height: 230px; }
    .tagline { font-size: 1.45rem; }
  }
  @media (prefers-reduced-motion: reduce) { .icon { animation: none; } }
</style>
</head>
<body>
<div class="bg"></div>
<div class="tint"></div>
<div class="snow" id="snow" aria-hidden="true"></div>

<main>
  <img class="icon" src="assets/icon.jpg" alt="">
  <h1>Mutsify<sup>™</sup></h1>

  <section class="stage glass">
    <label class="drop" id="drop">
      <input type="file" id="file" accept="image/*">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4.5-4.5L6 21"/>
      </svg>
      Drop a photo
      <small>or click to choose one</small>
    </label>

    <div class="frame" id="frame">
      <img id="funnyImg" alt="Funny Christmas version of your photo">
      <canvas id="eat" class="layer"></canvas>
      <canvas id="fx" class="layer"></canvas>
      <div id="reindeer" aria-hidden="true"><img src="assets/reindeer.webp" alt=""></div>
    </div>
  </section>

  <nav class="toolbar glass" aria-label="Actions">
    <button class="tool" id="choose" title="New photo" aria-label="New photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="tool" id="again" title="Again" aria-label="Make another version" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
    <button class="tool" id="save" title="Save" aria-label="Save image" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg>
    </button>
  </nav>

  <div class="dots" id="dots"></div>
  <div class="tagline" id="tagline"></div>
</main>

<div class="toast glass" id="toast"></div>

<script type="module">
import { loadDetectors, detectHeads } from "./engine.js";

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];

let photo = null, heads = [], detectReady = null;

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 4500);
}

// ---------- plush snowflakes ----------
{
  const count = innerWidth < 600 ? 14 : 24;
  for (let i = 0; i < count; i++) {
    const depth = Math.random();                       // 0 = far away, 1 = close by
    const f = document.createElement("div");
    f.className = "flake";
    const props = {
      "--x": `${rand(-4, 98)}vw`,
      "--size": `${Math.round(18 + depth * depth * 84)}px`,
      "--blur": `${(1 - depth) * 2.2 + (depth > .9 ? 1.5 : 0)}px`,
      "--alpha": (0.55 + depth * 0.45).toFixed(2),
      "--fall": `${(30 - depth * 16).toFixed(1)}s`,     // close flakes fall faster
      "--delay": `${-rand(0, 30).toFixed(1)}s`,         // already mid-air on load
      "--sway": `${rand(2.5, 5).toFixed(1)}s`,
      "--drift": `${Math.round(rand(15, 50))}px`,
      "--twirl": `${rand(10, 24).toFixed(1)}s`,
      "--turn": `${pick([-360, 360])}deg`,
    };
    for (const [k, v] of Object.entries(props)) f.style.setProperty(k, v);
    f.innerHTML = `<span><img src="assets/flake${1 + (i % 2)}.webp" alt=""></span>`;
    $("snow").appendChild(f);
  }
}

// ---------- colour dots ----------
const TINTS = [
  { c: "47, 106, 160", name: "Frosty Blue • Snowdeer" },
  { c: "176, 50, 66", name: "Cranberry • Rudolph" },
  { c: "46, 122, 88", name: "Pine • Mistletoe" },
  { c: "190, 122, 62", name: "Gingerbread • Cookie" },
  { c: "142, 104, 184", name: "Sugarplum • Dancer" },
];
function setTint(i) {
  document.documentElement.style.setProperty("--tint", TINTS[i].c);
  $("tagline").textContent = TINTS[i].name;
  [...$("dots").children].forEach((d, k) => d.classList.toggle("on", k === i));
  try { localStorage.setItem("mutsify-tint", i); } catch {}
}
TINTS.forEach((t, i) => {
  const b = document.createElement("button");
  b.className = "dot"; b.style.setProperty("--c", `rgb(${t.c})`); b.setAttribute("aria-label", t.name);
  b.onclick = () => setTint(i);
  $("dots").appendChild(b);
});
{ let i = 0; try { i = +localStorage.getItem("mutsify-tint") || 0; } catch {} setTint(TINTS[i] ? i : 0); }

// ---------- face finder in a background thread (falls back to this page if workers fail) ----------
let worker = null, jobs = 0;
const pending = new Map();
try {
  worker = new Worker(new URL("./detect-worker.js", import.meta.url), { type: "module" });
  worker.onmessage = ({ data }) => { const p = pending.get(data.id); pending.delete(data.id); data.ok ? p?.res(data) : p?.rej(new Error(data.error)); };
  worker.onerror = () => { worker = null; pending.forEach(p => p.rej(new Error("worker failed"))); pending.clear(); };
} catch { worker = null; }
const ask = msg => new Promise((res, rej) => { const id = ++jobs; pending.set(id, { res, rej }); worker.postMessage({ ...msg, id }, msg.bitmap ? [msg.bitmap] : []); });

async function findHeads(src) {
  if (worker) {
    try { return (await ask({ type: "detect", bitmap: await createImageBitmap(src) })).heads; }
    catch (err) { console.warn("worker detection failed, using the page instead", err); worker = null; }
  }
  await loadDetectors();
  return detectHeads(src);
}

// ---------- watermark: small "Mutsify" badge with a QR code, bottom left ----------
const loadImage = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
let qrImage = null;

async function watermark(src) {
  const [img, qr] = await Promise.all([loadImage(src), qrImage ??= loadImage("assets/qr.png")]);
  try { await document.fonts.load("700 40px Inter"); } catch {}
  const W = img.naturalWidth, H = img.naturalHeight, c = document.createElement("canvas");
  c.width = W; c.height = H;
  const g = c.getContext("2d");
  g.drawImage(img, 0, 0);

  const s = Math.min(W, H);
  // Subtle mark: a small QR on its own little white tile (whole pixels per module, at least 2 px each) and a soft white "Mutsify" next to it. No card behind it.
  const q = 29 * Math.max(2, Math.round(s * 0.05 / 29));
  const pad = Math.round(q / 29 * 3), margin = Math.round(s * 0.025);   // pad = 3 modules of quiet zone
  const size = Math.max(11, Math.round(q * 0.3));
  const font = "Inter, -apple-system, system-ui, sans-serif";
  const x = margin, y = H - margin - q - pad * 2;

  g.save();
  g.globalAlpha = 0.9;
  g.fillStyle = "#fff";
  g.beginPath(); g.roundRect(x, y, q + pad * 2, q + pad * 2, pad * 1.5); g.fill();
  g.restore();
  g.imageSmoothingEnabled = false;                      // keep the QR modules crisp
  g.drawImage(qr, x + pad, y + pad, q, q);
  g.imageSmoothingEnabled = true;

  g.save();
  g.font = `600 ${size}px ${font}`; g.textBaseline = "middle";
  g.shadowColor = "rgba(0,0,0,.45)"; g.shadowBlur = size * 0.4; g.shadowOffsetY = size * 0.05;
  g.fillStyle = "rgba(255,255,255,.85)";
  g.fillText("Mutsify", x + q + pad * 2 + size * 0.5, y + (q + pad * 2) / 2);
  g.restore();

  return new Promise(res => c.toBlob(res, "image/jpeg", 0.92));
}

// ---------- saving: straight to the photo library on phones, a download elsewhere ----------
let resultFile = null;

async function savePhoto() {
  if (!resultFile) return;
  const phone = matchMedia("(pointer: coarse)").matches;
  if (phone && navigator.canShare?.({ files: [resultFile] })) {
    try {
      // Opens the share sheet: "Save Image" puts it in Photos (iPhone) / Gallery (Android).
      await navigator.share({ files: [resultFile], title: "Mutsify" });
      return;
    } catch (err) {
      if (err.name === "AbortError") return;            // the visitor closed the sheet
    }
  }
  saveBlob(resultFile, resultFile.name);
}

function saveBlob(blob, name) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

// ---------- the fluffy reindeer eats your photo while the AI works ----------
const frame = $("frame"), eat = $("eat"), fx = $("fx"), deer = $("reindeer");
const ectx = eat.getContext("2d", { willReadFrequently: true }), fctx = fx.getContext("2d");
const DEER_RATIO = 555 / 480;                 // height / width of assets/reindeer.webp
const MOUTH = { x: 0.885, y: 0.415 };          // where its mouth is inside that image
const NOMS = ["nom nom", "*crunch*", "mmm, pixels", "yum!", "*munch*", "tasty!", "chomp!", "so festive 😋"];

function sizeLayers() {
  const r = frame.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
  for (const c of [eat, fx]) { c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr); }
  ectx.setTransform(dpr, 0, 0, dpr, 0, 0); fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return r;
}

function bubble(text, x, y, ms = 1100) {
  const b = document.createElement("div");
  b.className = "bubble"; b.textContent = text; b.style.left = `${x}px`; b.style.top = `${y}px`;
  frame.appendChild(b); setTimeout(() => b.remove(), ms);
}

function startEating() {
  const r = sizeLayers(), W = r.width, H = r.height;
  ectx.globalCompositeOperation = "source-over";
  ectx.drawImage(photo, 0, 0, W, H);
  eat.style.transition = ""; eat.style.opacity = 1;
  $("funnyImg").classList.remove("show");

  const dw = Math.max(110, Math.min(220, W * 0.36)), dh = dw * DEER_RATIO;
  deer.style.width = `${dw}px`; deer.style.height = `${dh}px`; deer.style.display = "block";
  const state = { done: false, crumbs: [], pos: { x: -dw * 0.3, y: H * 0.3 }, left: false, W, H, dw, dh, alive: true };
  const bubbleY = () => state.pos.y - dh * 0.5;

  const place = () => {
    const mx = state.left ? 1 - MOUTH.x : MOUTH.x;
    deer.style.left = `${state.pos.x - mx * dw}px`; deer.style.top = `${state.pos.y - MOUTH.y * dh}px`;
    deer.classList.toggle("left", state.left);
  };
  place();

  const tick = () => {                          // falling crumbs
    if (!state.alive) return;
    fctx.clearRect(0, 0, W, H);
    state.crumbs = state.crumbs.filter(c => c.life > 0);
    for (const c of state.crumbs) {
      c.vy += 0.35; c.x += c.vx; c.y += c.vy; c.life -= 1; c.rot += c.vr;
      fctx.save(); fctx.globalAlpha = Math.min(1, c.life / 20); fctx.translate(c.x, c.y); fctx.rotate(c.rot);
      fctx.fillStyle = c.color; fctx.fillRect(-c.s / 2, -c.s / 2, c.s, c.s); fctx.restore();
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);

  const moveTo = (x, y, ms) => new Promise(res => {
    const sx = state.pos.x, sy = state.pos.y, t0 = performance.now();
    if (Math.abs(x - sx) > 4) state.left = x < sx;
    deer.classList.add("walking");
    const step = now => {
      const t = Math.min(1, (now - t0) / ms), e = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      state.pos.x = sx + (x - sx) * e; state.pos.y = sy + (y - sy) * e; place();
      if (t < 1 && state.alive) requestAnimationFrame(step); else { deer.classList.remove("walking"); res(); }
    };
    requestAnimationFrame(step);
  });

  const chomp = () => { deer.classList.remove("chomp"); void deer.offsetWidth; deer.classList.add("chomp"); };

  const bite = (x, y, r) => {
    const sx = Math.min(eat.width - 1, Math.max(0, x * eat.width / W)) | 0, sy = Math.min(eat.height - 1, Math.max(0, y * eat.height / H)) | 0;
    const px = ectx.getImageData(sx, sy, 1, 1).data;      // crumbs in the photo's own colour
    const color = px[3] ? `rgb(${px[0]},${px[1]},${px[2]})` : "#c48a52";
    ectx.globalCompositeOperation = "destination-out";
    ectx.beginPath(); ectx.arc(x, y, r, 0, Math.PI * 2); ectx.fill();
    for (let i = 0; i < 6; i++) {                          // scalloped, tooth-mark edge
      const a = rand(0, Math.PI * 2);
      ectx.beginPath(); ectx.arc(x + Math.cos(a) * r * 0.92, y + Math.sin(a) * r * 0.92, r * rand(0.25, 0.4), 0, Math.PI * 2); ectx.fill();
    }
    ectx.globalCompositeOperation = "source-over";
    for (let i = 0; i < 14; i++) state.crumbs.push({ x, y, vx: rand(-3, 3), vy: rand(-4, 0), s: rand(3, 7), color, life: rand(35, 60), rot: 0, vr: rand(-.3, .3) });
  };

  state.run = (async () => {
    const r = Math.max(18, Math.min(W, H) * 0.1), step = r * 1.35, rows = [];
    for (let y = r * 0.6, i = 0; y < H; y += step, i++) {
      const row = [];
      for (let x = r * 0.6; x < W; x += step) row.push({ x: x + rand(-r * .2, r * .2), y: y + rand(-r * .2, r * .2) });
      rows.push(i % 2 ? row.reverse() : row);
    }
    const targets = rows.flat();
    await moveTo(targets[0].x, targets[0].y, 1300);
    if (!state.done) { bubble("Ooh, a photo! 🦌", state.pos.x, bubbleY(), 1500); await sleep(700); }
    const t0 = performance.now();
    for (const t of targets) {
      if (state.done) break;
      await moveTo(t.x, t.y, 380);
      if (state.done) break;
      chomp();
      await sleep(120); bite(t.x, t.y, r);
      await sleep(240); bite(t.x + rand(-r * .4, r * .4), t.y + rand(-r * .3, r * .3), r * 0.8);
      await sleep(150);
      if (Math.random() < 0.16) bubble(pick(NOMS), state.pos.x, bubbleY());
      await sleep(200 + (performance.now() - t0) / 60);   // slow down over time so the photo lasts
    }
    while (!state.done) {
      bubble(pick(["more please? 🥺", "is dessert coming?", "*licks plate*", "still hungry…"]), state.pos.x, bubbleY(), 1500);
      chomp(); await sleep(2200);
    }
  })();
  return state;
}

async function stopEating(state, ok, message) {
  state.done = true;
  await state.run;
  const { W, H } = state;
  bubble(message || (ok ? "*BURP* 🎁" : "oops… I'm stuffed 🤢"), state.pos.x, state.pos.y - state.dh * .5, 1800);
  await sleep(700);
  if (ok) {
    $("funnyImg").classList.add("show");
    eat.style.transition = "opacity .6s"; eat.style.opacity = 0;
    sparkle(W, H);
  } else {
    ectx.globalCompositeOperation = "source-over"; ectx.drawImage(photo, 0, 0, W, H);   // give the photo back
  }
  await new Promise(res => {
    const sx = state.pos.x, t0 = performance.now(); deer.classList.add("walking"); deer.classList.remove("left");
    const step = now => {
      const t = Math.min(1, (now - t0) / 1200);
      state.pos.x = sx + (W + state.dw - sx) * t * t;
      deer.style.left = `${state.pos.x - MOUTH.x * state.dw}px`;
      if (t < 1) requestAnimationFrame(step); else res();
    };
    requestAnimationFrame(step);
  });
  deer.style.display = "none"; deer.classList.remove("walking", "chomp");
  state.alive = false; fctx.clearRect(0, 0, W, H);
}

function sparkle(W, H) {
  const marks = ["✦", "❄", "✧", "•"];
  for (let i = 0; i < 46; i++) {
    const p = document.createElement("i");
    p.textContent = pick(marks);
    p.style.cssText = `position:absolute;left:${W / 2}px;top:${H / 2}px;z-index:7;pointer-events:none;font-style:normal;line-height:1;color:#fff;font-size:${rand(12, 26)}px;text-shadow:0 0 10px rgba(255,255,255,.9)`;
    frame.appendChild(p);
    const a = rand(0, Math.PI * 2), d = rand(80, Math.max(W, H) * 0.7);
    p.animate([
      { transform: "translate(-50%,-50%) scale(.4)", opacity: 1 },
      { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d}px) scale(1) rotate(${rand(-180, 180)}deg)`, opacity: 0 },
    ], { duration: rand(900, 1600), easing: "cubic-bezier(.2,.8,.3,1)" }).onfinish = () => p.remove();
  }
}

// ---------- funny (AI) version ----------
async function api(url, init) {
  const res = await fetch(url, init);
  const data = await res.json().catch(() => ({ error: `Server error ${res.status}` }));
  if (!res.ok || data.error) throw Object.assign(new Error(data.error || `Server error ${res.status}`), { data });
  return data;
}

function photoAsDataURL(maxSide = 1024) {
  const k = Math.min(1, maxSide / Math.max(photo.width, photo.height));
  const c = document.createElement("canvas");
  c.width = Math.round(photo.width * k); c.height = Math.round(photo.height * k);
  c.getContext("2d").drawImage(photo, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.9);
}

function subjectCounts() {
  const counts = {};
  for (const h of heads) counts[h.label || "person"] = (counts[h.label || "person"] || 0) + 1;
  return counts;
}

let busy = false;
async function makeFunny() {
  if (!photo || busy) return;
  busy = true; $("again").disabled = true; $("save").disabled = true; $("again").classList.add("spin");
  resultFile = null;
  if ($("funnyImg").src.startsWith("blob:")) URL.revokeObjectURL($("funnyImg").src);
  const state = startEating();
  let ok = false, message = null, remaining = null;
  try {
    await detectReady;                     // lets the prompt name exactly who is in the photo
    const first = await api("/api/funhouse", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ image: photoAsDataURL(), subjects: subjectCounts() }),
    });
    remaining = first.remaining ?? null;
    let result = first.status === "succeeded" ? first.image : null, failures = 0;
    const t0 = Date.now();
    while (!result) {
      await sleep(2000);
      let r;
      try { r = await api(`/api/funhouse?id=${encodeURIComponent(first.id)}`); failures = 0; }
      catch (err) { if (++failures >= 6) throw err; continue; }
      if (r.status === "succeeded") result = r.image;
      else if (r.status === "failed" || r.status === "canceled") throw new Error(r.error || "Generation failed");
      else if (Date.now() - t0 > 180000) throw new Error("This took too long");
    }
    const marked = await watermark(result);
    resultFile = new File([marked], `mutsify-${Date.now()}.jpg`, { type: "image/jpeg" });
    await new Promise((res, rej) => { const img = $("funnyImg"); img.onload = res; img.onerror = rej; img.src = URL.createObjectURL(marked); });
    ok = true;
  } catch (err) {
    console.error(err);
    if (err.data?.limited) {
      const at = new Date(err.data.retryAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      message = "I'm full for now 😴";
      toast(`You've made 10 pictures in the last 5 hours. More from ${at} 🦌`);
    } else {
      toast(location.protocol === "file:" ? "This needs the Mutsify server 🙈" : "That didn't work — try again ↻");
    }
  } finally {
    await stopEating(state, ok, message);
    busy = false; $("again").disabled = false; $("save").disabled = !ok; $("again").classList.remove("spin");
    if (ok && remaining !== null && remaining <= 3) {
      toast(remaining === 0 ? "That was your last one for the next 5 hours 🦌" : `${remaining} more for the next 5 hours 🦌`);
    }
  }
}
$("again").onclick = makeFunny;
$("save").onclick = savePhoto;
$("choose").onclick = () => $("file").click();

// ---------- loading a photo ----------
async function loadFile(file) {
  if (!file || !file.type.startsWith("image/")) { toast("That's not a photo 🤔"); return; }
  if (busy) { toast("Hang on, the reindeer is still eating 🦌"); return; }
  const url = URL.createObjectURL(file), img = new Image();
  img.src = url;
  try { await img.decode(); } catch { toast("Couldn't open that photo"); return; }
  const s = Math.min(1, 1800 / Math.max(img.naturalWidth, img.naturalHeight));
  photo = document.createElement("canvas");
  photo.width = Math.round(img.naturalWidth * s); photo.height = Math.round(img.naturalHeight * s);
  photo.getContext("2d").drawImage(img, 0, 0, photo.width, photo.height);
  URL.revokeObjectURL(url);

  $("funnyImg").removeAttribute("src");
  $("funnyImg").style.aspectRatio = `${photo.width} / ${photo.height}`;
  heads = [];
  document.body.classList.add("has-photo");
  await new Promise(r => requestAnimationFrame(r));

  // Find out who is in the photo (e.g. "two dogs") so the AI prompt can name them exactly.
  // If that fails the AI still works, just with a more generic prompt.
  detectReady = findHeads(photo).then(h => { heads = h; }, err => { console.warn(err); heads = []; });
  makeFunny();
}

$("file").addEventListener("change", e => { loadFile(e.target.files[0]); e.target.value = ""; });
const drop = $("drop");
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); loadFile(e.dataTransfer.files[0]); });
document.addEventListener("paste", e => {
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith("image/"));
  if (item) loadFile(item.getAsFile());
});

// Warm up the face finder while the visitor is still picking a photo.
const warmUp = () => (worker ? ask({ type: "warm" }) : loadDetectors()).catch(() => {});
if ("requestIdleCallback" in window) requestIdleCallback(warmUp, { timeout: 2500 }); else setTimeout(warmUp, 1200);
</script>
