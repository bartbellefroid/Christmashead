<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mutsify</title>
<meta name="description" content="Drop a photo, get Christmas hats on every face — plus a funny AI version.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
<style>
  /* ============ shared layout ============ */
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: var(--font); color: var(--ink); background: var(--bg);
    overflow-x: hidden; transition: color .4s;
  }
  .deco { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .flake { position: absolute; top: -20px; animation: fall linear infinite; }
  @keyframes fall { to { transform: translate3d(var(--drift), 110vh, 0) rotate(var(--spin)); } }
  main { position: relative; z-index: 1; max-width: 1040px; margin: 0 auto; padding: 28px 16px 120px; text-align: center; }

  .logo { position: relative; display: inline-block; margin: 26px 0 4px; font-size: clamp(3.2rem, 13vw, 7rem); line-height: 1; letter-spacing: -0.02em; }
  .logo .hat { position: absolute; width: .62em; left: -.16em; top: -.42em; transform-origin: 70% 90%; animation: wiggle 2.6s ease-in-out infinite; }
  @keyframes wiggle { 0%,100% { transform: rotate(-18deg); } 50% { transform: rotate(-6deg) translateY(-3px); } }
  .sub { margin: 6px 0 26px; font-size: 1.25rem; opacity: .85; }

  .upload {
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    width: min(420px, 100%); aspect-ratio: 1.6; cursor: pointer; font-size: 1.5rem;
    transition: transform .2s cubic-bezier(.34,1.56,.64,1);
  }
  .upload:hover, .upload.over { transform: scale(1.04) rotate(-1deg); }
  .upload .icon { font-size: 3.4rem; animation: bob 1.8s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-8px) rotate(6deg); } }
  .upload input { display: none; }
  body.has-photo .upload { display: none; }

  .results { display: none; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 8px; text-align: left; }
  body.has-photo .results { display: grid; }
  @media (max-width: 720px) { .results { grid-template-columns: 1fr; } }

  .card { position: relative; padding: 16px; }
  .card h2 { margin: 0 0 12px; font-size: 1.8rem; display: flex; align-items: center; gap: 10px; }
  .frame { position: relative; border-radius: 16px; background: var(--bite-bg); line-height: 0; }
  .frame > canvas, .frame > img { display: block; width: 100%; height: auto; border-radius: 16px; }
  .frame > .layer { position: absolute; inset: 0; width: 100%; height: 100%; }
  #funnyImg { opacity: 0; transform: scale(.85); transition: opacity .5s, transform .6s cubic-bezier(.34,1.56,.64,1); }
  #funnyImg.show { opacity: 1; transform: none; }
  #muts { touch-action: none; cursor: grab; }

  .actions { display: flex; gap: 10px; margin-top: 14px; }
  .btn {
    font: inherit; font-size: 1.15rem; cursor: pointer; border: none; padding: 10px 18px;
    display: inline-flex; align-items: center; gap: 8px;
    transition: transform .15s cubic-bezier(.34,1.56,.64,1), filter .15s;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px) scale(1.05); }
  .btn:active:not(:disabled) { transform: scale(.95); }
  .btn:disabled { opacity: .45; cursor: default; }

  .busy {
    position: absolute; inset: 0; display: grid; place-items: center; line-height: 1.2; text-align: center;
    font-size: 1.3rem; border-radius: 16px; background: rgba(0,0,0,.35); color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.5);
  }
  .busy span { display: inline-block; animation: bob 1s ease-in-out infinite; font-size: 2.4rem; }
  .busy[hidden] { display: none; }

  .newphoto { margin-top: 30px; display: none; }
  body.has-photo .newphoto { display: inline-flex; }

  /* reindeer */
  #reindeer { position: absolute; z-index: 5; pointer-events: none; display: none; filter: drop-shadow(0 6px 6px rgba(0,0,0,.35)); }
  #reindeer svg { width: 100%; height: 100%; overflow: visible; transition: transform .2s; }
  #reindeer.left svg { transform: scaleX(-1); }
  #reindeer .leg { transform-box: fill-box; transform-origin: 50% 0; }
  #reindeer.walking .leg.a { animation: step .36s ease-in-out infinite alternate; }
  #reindeer.walking .leg.b { animation: step .36s ease-in-out infinite alternate-reverse; }
  @keyframes step { from { transform: rotate(-16deg); } to { transform: rotate(16deg); } }
  #reindeer .jaw { transform-box: view-box; transform-origin: 180px 66px; }
  #reindeer.chomp .jaw { animation: chomp .26s ease-in-out 2; }
  #reindeer.chomp .head { animation: headbob .26s ease-in-out 2; transform-box: view-box; transform-origin: 160px 80px; }
  @keyframes chomp { 50% { transform: rotate(24deg); } }
  @keyframes headbob { 50% { transform: rotate(7deg); } }
  #reindeer .nose { animation: glow 1.2s ease-in-out infinite; }
  @keyframes glow { 50% { filter: drop-shadow(0 0 7px #ff3030) brightness(1.3); } }
  .bubble {
    position: absolute; z-index: 6; padding: 6px 12px; border-radius: 16px; background: #fff; color: #222;
    font-size: 1.05rem; line-height: 1.2; white-space: nowrap; box-shadow: 0 4px 12px rgba(0,0,0,.25);
    transform: translate(-50%, -100%) scale(0); animation: pop .25s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes pop { to { transform: translate(-50%, -100%) scale(1); } }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 20;
    background: #222; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 1rem; display: none;
  }
  .toast.show { display: block; }

  /* ============ Gingerbread design ============ */
  [data-design="ginger"] {
    --font: "Chewy", system-ui, sans-serif; --ink: #4a2511;
    --bg: radial-gradient(circle, #f2cf9e 2px, transparent 2.5px) 0 0 / 26px 26px, #fbe6c4;
    --bite-bg: radial-gradient(circle, #ff5a7a 2px, transparent 2.5px) 0 0 / 18px 18px,
               radial-gradient(circle, #6ee0a0 2px, transparent 2.5px) 9px 9px / 18px 18px, #5a2d12;
  }
  [data-design="ginger"] .logo { color: #a0522d; text-shadow: 0 4px 0 #fff, 0 8px 0 #6b3416, 0 14px 18px rgba(0,0,0,.25); }
  [data-design="ginger"] .upload, [data-design="ginger"] .card {
    background: #b8692f; color: #fff7ea; border-radius: 34px;
    border: 7px dashed #fff7ea; outline: 8px solid #b8692f; box-shadow: 0 14px 0 8px #7a3c15, 0 22px 30px rgba(0,0,0,.25);
  }
  [data-design="ginger"] .upload { margin: 14px 0; }
  [data-design="ginger"] .card:nth-child(1) { transform: rotate(-1deg); }
  [data-design="ginger"] .card:nth-child(2) { transform: rotate(1deg); }
  [data-design="ginger"] .card h2 { color: #fff7ea; text-shadow: 0 3px 0 #7a3c15; }
  [data-design="ginger"] .frame { border: 5px solid #fff7ea; }
  [data-design="ginger"] .btn {
    border-radius: 22px 22px 16px 16px; color: #fff; background: #e8344e; text-shadow: 0 2px 0 rgba(0,0,0,.2);
    box-shadow: inset 0 -6px 0 rgba(0,0,0,.18), inset 0 6px 0 rgba(255,255,255,.35), 0 5px 0 #7a3c15;
  }
  [data-design="ginger"] .btn.alt { background: #2fb36b; }
  [data-design="ginger"] .newphoto { background: #f5b82e; }
  [data-design="ginger"] .flake { width: 14px; height: 5px; border-radius: 3px; }
  [data-design="ginger"] .flake:nth-child(4n) { background: #e8344e; }
  [data-design="ginger"] .flake:nth-child(4n+1) { background: #2fb36b; }
  [data-design="ginger"] .flake:nth-child(4n+2) { background: #f5b82e; }
  [data-design="ginger"] .flake:nth-child(4n+3) { background: #fff; }

  @media (prefers-reduced-motion: reduce) {
    .flake, .logo .hat, .upload .icon { animation: none !important; }
    .flake { display: none; }
  }
</style>
</head>
<body data-design="ginger">
<div class="deco" id="deco"></div>

<main>
  <h1 class="logo">
    <svg class="hat" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M14 78 Q30 20 70 12 Q88 10 92 30 Q80 22 70 30 Q60 50 62 78 Z" fill="#e8203a"/>
      <circle cx="92" cy="32" r="9" fill="#fff"/>
      <rect x="6" y="70" width="64" height="18" rx="9" fill="#fff"/>
    </svg>Mutsify
  </h1>
  <p class="sub">Drop a photo. Get hats. 🎄</p>

  <label class="upload" id="drop">
    <input type="file" id="file" accept="image/*">
    <span class="icon">📸</span>
    <span>Choose a photo</span>
  </label>

  <section class="results">
    <article class="card">
      <h2>🎅 Muts</h2>
      <div class="frame">
        <canvas id="muts"></canvas>
        <div class="busy" id="mutsBusy" hidden><div><span>🎅</span><br>Finding faces…</div></div>
      </div>
      <div class="actions">
        <button class="btn" id="mutsAgain" aria-label="New hats">🎲 Again</button>
        <button class="btn alt" id="mutsSave" aria-label="Download hat version">⬇ Save</button>
      </div>
    </article>

    <article class="card">
      <h2>🤪 Funny</h2>
      <div class="frame" id="funnyFrame">
        <img id="funnyImg" alt="Funny AI version of your photo">
        <canvas id="eat" class="layer"></canvas>
        <canvas id="fx" class="layer"></canvas>
        <div id="reindeer" aria-hidden="true">
          <svg viewBox="0 -12 220 182">
            <g class="leg a"><rect x="52" y="112" width="12" height="46" rx="6" fill="#6d3f1d"/><rect x="51" y="150" width="14" height="9" rx="3" fill="#2b1a0e"/></g>
            <g class="leg b"><rect x="72" y="114" width="12" height="44" rx="6" fill="#8a5428"/><rect x="71" y="150" width="14" height="9" rx="3" fill="#2b1a0e"/></g>
            <g class="leg b"><rect x="112" y="114" width="12" height="44" rx="6" fill="#6d3f1d"/><rect x="111" y="150" width="14" height="9" rx="3" fill="#2b1a0e"/></g>
            <g class="leg a"><rect x="132" y="112" width="12" height="46" rx="6" fill="#8a5428"/><rect x="131" y="150" width="14" height="9" rx="3" fill="#2b1a0e"/></g>
            <circle cx="38" cy="86" r="11" fill="#f3e3c8"/>
            <ellipse cx="95" cy="98" rx="60" ry="34" fill="#9a5f2c"/>
            <ellipse cx="98" cy="112" rx="42" ry="15" fill="#c48a52"/>
            <path d="M128 92 Q146 66 156 46 L180 54 Q170 86 152 110 Z" fill="#9a5f2c"/>
            <g class="head">
              <path d="M160 30 Q150 10 136 2 M150 17 Q160 8 157 -2 M176 28 Q182 8 198 0 M184 14 Q176 5 178 -5" stroke="#e2bd85" stroke-width="6" stroke-linecap="round" fill="none"/>
              <ellipse cx="150" cy="38" rx="11" ry="5" transform="rotate(-32 150 38)" fill="#7a4520"/>
              <ellipse cx="170" cy="48" rx="25" ry="21" fill="#9a5f2c"/>
              <ellipse cx="192" cy="58" rx="18" ry="13" fill="#c48a52"/>
              <path class="jaw" d="M176 64 Q194 82 207 66 Q194 72 178 64 Z" fill="#5a3216"/>
              <circle class="nose" cx="207" cy="54" r="8.5" fill="#ff2a2a"/>
              <circle cx="204.5" cy="51.5" r="2.4" fill="#fff" opacity=".7"/>
              <circle cx="172" cy="42" r="4.6" fill="#1d120a"/>
              <circle cx="173.6" cy="40.4" r="1.6" fill="#fff"/>
            </g>
            <path d="M140 76 Q156 88 174 76 L178 88 Q156 102 136 88 Z" fill="#e8203a"/>
            <path d="M146 82 L150 94 M158 84 L160 97 M168 81 L171 93" stroke="#fff" stroke-width="3"/>
            <path d="M142 86 L136 112 L148 112 L152 90 Z" fill="#e8203a"/>
          </svg>
        </div>
      </div>
      <div class="actions">
        <button class="btn" id="funnyAgain" aria-label="Make another funny version" disabled>🎲 Again</button>
        <button class="btn alt" id="funnySave" aria-label="Download funny version" disabled>⬇ Save</button>
      </div>
    </article>
  </section>

  <button class="btn newphoto" id="newPhoto">📸 New photo</button>
</main>

<div class="toast" id="toast"></div>


<script type="module">
import { loadDetectors, detectHeads, hatsForHead, keepVisible, drawHat, localBounds, toLocal, setCanvasSize, STYLES, shuffle } from "./engine.js";

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];

let photo = null, heads = [], hats = [], detectReady = null;

// ---------- face finder in a background thread (falls back to this page if workers fail) ----------
let worker = null, jobs = 0;
const pending = new Map();
try {
  worker = new Worker(new URL("./detect-worker.js", import.meta.url), { type: "module" });
  worker.onmessage = ({ data }) => { const p = pending.get(data.id); pending.delete(data.id); data.ok ? p?.res(data) : p?.rej(new Error(data.error)); };
  worker.onerror = () => { worker = null; pending.forEach(p => p.rej(new Error("worker failed"))); pending.clear(); };
} catch { worker = null; }
const ask = msg => new Promise((res, rej) => { const id = ++jobs; pending.set(id, { res, rej }); worker.postMessage({ ...msg, id }, msg.bitmap ? [msg.bitmap] : []); });

async function findHeads(src) {
  if (worker) {
    try { return (await ask({ type: "detect", bitmap: await createImageBitmap(src) })).heads; }
    catch (err) { console.warn("worker detection failed, using the page instead", err); worker = null; }
  }
  await loadDetectors();
  return detectHeads(src);
}
const muts = $("muts"), mctx = muts.getContext("2d");

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 4500);
}

// falling sprinkles
for (let i = 0; i < 34; i++) {
  const f = document.createElement("i");
  f.className = "flake";
  f.style.left = `${rand(0, 100)}vw`;
  f.style.animationDuration = `${rand(9, 20)}s`;
  f.style.animationDelay = `${-rand(0, 20)}s`;
  f.style.setProperty("--drift", `${rand(-12, 12)}vw`);
  f.style.setProperty("--spin", `${rand(-540, 540)}deg`);
  $("deco").appendChild(f);
}

// ---------- muts (hat) version ----------
function renderMuts() {
  if (!photo) return;
  mctx.drawImage(photo, 0, 0);
  hats.forEach(h => drawHat(mctx, h));
}

function placeHats() {
  hats = [];
  const order = shuffle([...STYLES]);
  heads.forEach((head, i) => hats.push(...keepVisible(hatsForHead(head, order[(i + Math.floor(Math.random() * 3)) % order.length]))));
  renderMuts();
}

// drag hats around (no extra UI)
let drag = null;
const pointIn = e => { const r = muts.getBoundingClientRect(); return { x: (e.clientX - r.left) * muts.width / r.width, y: (e.clientY - r.top) * muts.height / r.height }; };
muts.addEventListener("pointerdown", e => {
  const p = pointIn(e);
  for (let i = hats.length - 1; i >= 0; i--) {
    const l = toLocal(hats[i], p.x, p.y), b = localBounds(hats[i]);
    if (l.x >= b.x0 && l.x <= b.x1 && l.y >= b.y0 && l.y <= b.y1) {
      const [h] = hats.splice(i, 1); hats.push(h);
      drag = { h, dx: p.x - h.x, dy: p.y - h.y }; muts.setPointerCapture(e.pointerId); return;
    }
  }
});
muts.addEventListener("pointermove", e => { if (!drag) return; const p = pointIn(e); drag.h.x = p.x - drag.dx; drag.h.y = p.y - drag.dy; renderMuts(); });
muts.addEventListener("pointerup", () => { drag = null; });
muts.addEventListener("pointercancel", () => { drag = null; });

$("mutsAgain").onclick = () => { if (heads.length) placeHats(); else toast("No faces found in this photo 🙈"); };
$("mutsSave").onclick = () => muts.toBlob(b => saveBlob(b, "mutsify.jpg"), "image/jpeg", 0.92);

function saveBlob(blob, name) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

// ---------- reindeer that eats your photo while the AI works ----------
const frame = $("funnyFrame"), eat = $("eat"), fx = $("fx"), deer = $("reindeer");
const ectx = eat.getContext("2d", { willReadFrequently: true }), fctx = fx.getContext("2d");
const MOUTH = { x: 200 / 220, y: (68 + 12) / 182 };   // mouth position inside the SVG box
const NOMS = ["nom nom", "*crunch*", "mmm, pixels", "yum!", "*munch*", "tasty!", "chomp!", "so festive 😋"];

function sizeLayers() {
  const r = frame.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
  for (const c of [eat, fx]) { c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr); }
  ectx.setTransform(dpr, 0, 0, dpr, 0, 0); fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return r;
}

function bubble(text, x, y, ms = 1100) {
  const b = document.createElement("div");
  b.className = "bubble"; b.textContent = text; b.style.left = `${x}px`; b.style.top = `${y}px`;
  frame.appendChild(b); setTimeout(() => b.remove(), ms);
}

function startEating() {
  const r = sizeLayers(), W = r.width, H = r.height;
  ectx.globalCompositeOperation = "source-over";
  ectx.drawImage(photo, 0, 0, W, H);
  eat.style.transition = ""; eat.style.opacity = 1;
  $("funnyImg").classList.remove("show");

  const dw = Math.max(110, Math.min(230, W * 0.42)), dh = dw * 182 / 220;
  deer.style.width = `${dw}px`; deer.style.height = `${dh}px`; deer.style.display = "block";
  const state = { done: false, crumbs: [], pos: { x: -dw * 0.4, y: H * 0.3 }, left: false, W, H, dw, dh, alive: true };

  const place = () => {
    const mx = state.left ? 1 - MOUTH.x : MOUTH.x;
    deer.style.left = `${state.pos.x - mx * dw}px`; deer.style.top = `${state.pos.y - MOUTH.y * dh}px`;
    deer.classList.toggle("left", state.left);
  };
  place();

  // crumbs animation loop
  const tick = () => {
    if (!state.alive) return;
    fctx.clearRect(0, 0, W, H);
    state.crumbs = state.crumbs.filter(c => c.life > 0);
    for (const c of state.crumbs) {
      c.vy += 0.35; c.x += c.vx; c.y += c.vy; c.life -= 1; c.rot += c.vr;
      fctx.save(); fctx.globalAlpha = Math.min(1, c.life / 20); fctx.translate(c.x, c.y); fctx.rotate(c.rot);
      fctx.fillStyle = c.color; fctx.fillRect(-c.s / 2, -c.s / 2, c.s, c.s); fctx.restore();
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);

  const moveTo = (x, y, ms) => new Promise(res => {
    const sx = state.pos.x, sy = state.pos.y, t0 = performance.now();
    if (Math.abs(x - sx) > 4) state.left = x < sx;
    deer.classList.add("walking");
    const step = now => {
      const t = Math.min(1, (now - t0) / ms), e = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      state.pos.x = sx + (x - sx) * e; state.pos.y = sy + (y - sy) * e; place();
      if (t < 1 && state.alive) requestAnimationFrame(step); else { deer.classList.remove("walking"); res(); }
    };
    requestAnimationFrame(step);
  });

  const bite = (x, y, r) => {
    // sample the photo colour for the crumbs before it is gone
    const sx = Math.min(eat.width - 1, Math.max(0, x * eat.width / W)) | 0, sy = Math.min(eat.height - 1, Math.max(0, y * eat.height / H)) | 0;
    const px = ectx.getImageData(sx, sy, 1, 1).data;
    const color = px[3] ? `rgb(${px[0]},${px[1]},${px[2]})` : "#c48a52";
    ectx.globalCompositeOperation = "destination-out";
    ectx.beginPath(); ectx.arc(x, y, r, 0, Math.PI * 2); ectx.fill();
    for (let i = 0; i < 6; i++) {               // scalloped, tooth-mark edge
      const a = rand(0, Math.PI * 2);
      ectx.beginPath(); ectx.arc(x + Math.cos(a) * r * 0.92, y + Math.sin(a) * r * 0.92, r * rand(0.25, 0.4), 0, Math.PI * 2); ectx.fill();
    }
    ectx.globalCompositeOperation = "source-over";
    for (let i = 0; i < 14; i++) state.crumbs.push({ x, y, vx: rand(-3, 3), vy: rand(-4, 0), s: rand(3, 7), color, life: rand(35, 60), rot: 0, vr: rand(-.3, .3) });
  };

  state.run = (async () => {
    const r = Math.max(18, Math.min(W, H) * 0.1), step = r * 1.35;
    const rows = [];
    for (let y = r * 0.6, i = 0; y < H; y += step, i++) {
      const row = [];
      for (let x = r * 0.6; x < W; x += step) row.push({ x: x + rand(-r * .2, r * .2), y: y + rand(-r * .2, r * .2) });
      rows.push(i % 2 ? row.reverse() : row);
    }
    const targets = rows.flat();
    await moveTo(targets[0].x, targets[0].y, 1300);
    if (!state.done) { bubble("Ooh, a photo! 🦌", state.pos.x, state.pos.y - dh * .55, 1500); await sleep(700); }
    const t0 = performance.now();
    for (const t of targets) {
      if (state.done) break;
      await moveTo(t.x, t.y, 380);
      if (state.done) break;
      deer.classList.remove("chomp"); void deer.offsetWidth; deer.classList.add("chomp");
      await sleep(130); bite(t.x, t.y, r);
      await sleep(260); bite(t.x + rand(-r * .4, r * .4), t.y + rand(-r * .3, r * .3), r * 0.8);
      await sleep(150);
      if (Math.random() < 0.16) bubble(pick(NOMS), state.pos.x, state.pos.y - dh * .55);
      // eat a bit slower the longer it takes, so the photo lasts
      await sleep(200 + (performance.now() - t0) / 60);
    }
    while (!state.done) {   // photo finished but the AI isn't: wait politely
      bubble(pick(["more please? 🥺", "is dessert coming?", "*licks plate*", "still hungry…"]), state.pos.x, state.pos.y - dh * .55, 1500);
      deer.classList.remove("chomp"); void deer.offsetWidth; deer.classList.add("chomp");
      await sleep(2200);
    }
  })();
  return state;
}

async function stopEating(state, ok) {
  state.done = true;
  await state.run;
  const { W, H, dh } = state;
  bubble(ok ? "*BURP* 🎁" : "oops… I'm stuffed 🤢", state.pos.x, state.pos.y - dh * .55, 1600);
  await sleep(700);
  if (ok) {
    $("funnyImg").classList.add("show");
    eat.style.transition = "opacity .6s"; eat.style.opacity = 0;
    confetti(W, H);
  } else {
    ectx.globalCompositeOperation = "source-over"; ectx.drawImage(photo, 0, 0, W, H);   // give the photo back
  }
  await new Promise(res => {
    const sx = state.pos.x, t0 = performance.now(); deer.classList.add("walking"); deer.classList.remove("left");
    const step = now => {
      const t = Math.min(1, (now - t0) / 1200);
      state.pos.x = sx + (W + state.dw - sx) * t * t;
      deer.style.left = `${state.pos.x - MOUTH.x * state.dw}px`;
      if (t < 1) requestAnimationFrame(step); else res();
    };
    requestAnimationFrame(step);
  });
  deer.style.display = "none"; deer.classList.remove("walking", "chomp");
  state.alive = false; fctx.clearRect(0, 0, W, H);
}

function confetti(W, H) {
  const colors = ["#ff2d55", "#ffd93d", "#3ddc97", "#5b8cff", "#ff8fb8", "#fff"];
  for (let i = 0; i < 60; i++) {
    const p = document.createElement("i");
    p.style.cssText = `position:absolute;left:${W / 2}px;top:${H / 2}px;width:9px;height:14px;border-radius:2px;z-index:7;pointer-events:none;background:${pick(colors)}`;
    frame.appendChild(p);
    const a = rand(0, Math.PI * 2), d = rand(80, Math.max(W, H) * 0.7);
    p.animate([
      { transform: "translate(-50%,-50%) rotate(0)", opacity: 1 },
      { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d + 60}px) rotate(${rand(-720, 720)}deg)`, opacity: 0 },
    ], { duration: rand(900, 1500), easing: "cubic-bezier(.2,.8,.3,1)" }).onfinish = () => p.remove();
  }
}

// ---------- funny (AI) version ----------
async function api(url, init) {
  const res = await fetch(url, init);
  const data = await res.json().catch(() => ({ error: `Server error ${res.status}` }));
  if (!res.ok || data.error) throw new Error(data.error || `Server error ${res.status}`);
  return data;
}

function photoAsDataURL(maxSide = 1024) {
  const k = Math.min(1, maxSide / Math.max(photo.width, photo.height));
  const c = document.createElement("canvas");
  c.width = Math.round(photo.width * k); c.height = Math.round(photo.height * k);
  c.getContext("2d").drawImage(photo, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.9);
}

function subjectCounts() {
  const counts = {};
  for (const h of heads) counts[h.label || "person"] = (counts[h.label || "person"] || 0) + 1;
  return counts;
}

let funnyBusy = false;
async function makeFunny() {
  if (!photo || funnyBusy) return;
  funnyBusy = true; $("funnyAgain").disabled = true; $("funnySave").disabled = true;
  const state = startEating();
  let ok = false;
  try {
    await detectReady;                     // lets the prompt name exactly who is in the photo
    const first = await api("/api/funhouse", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ image: photoAsDataURL(), subjects: subjectCounts() }),
    });
    let result = first.status === "succeeded" ? first.image : null, failures = 0;
    const t0 = Date.now();
    while (!result) {
      await sleep(2000);
      let r;
      try { r = await api(`/api/funhouse?id=${encodeURIComponent(first.id)}`); failures = 0; }
      catch (err) { if (++failures >= 6) throw err; continue; }
      if (r.status === "succeeded") result = r.image;
      else if (r.status === "failed" || r.status === "canceled") throw new Error(r.error || "Generation failed");
      else if (Date.now() - t0 > 180000) throw new Error("This took too long");
    }
    await new Promise((res, rej) => { const img = $("funnyImg"); img.onload = res; img.onerror = rej; img.src = result; });
    ok = true;
  } catch (err) {
    console.error(err);
    toast(location.protocol === "file:" ? "The funny version needs the Mutsify server 🙈" : "The funny version didn't work, try 🎲 Again");
  } finally {
    await stopEating(state, ok);
    funnyBusy = false; $("funnyAgain").disabled = false; $("funnySave").disabled = !ok;
  }
}
$("funnyAgain").onclick = makeFunny;
$("funnySave").onclick = async () => saveBlob(await (await fetch($("funnyImg").src)).blob(), "mutsify-funny.jpg");

// ---------- loading a photo ----------
async function loadFile(file) {
  if (!file || !file.type.startsWith("image/")) { toast("That's not a photo 🤔"); return; }
  if (funnyBusy) { toast("Hang on, the reindeer is still eating 🦌"); return; }
  const url = URL.createObjectURL(file), img = new Image();
  img.src = url;
  try { await img.decode(); } catch { toast("Couldn't open that photo"); return; }
  const s = Math.min(1, 1800 / Math.max(img.naturalWidth, img.naturalHeight));
  photo = document.createElement("canvas");
  photo.width = Math.round(img.naturalWidth * s); photo.height = Math.round(img.naturalHeight * s);
  photo.getContext("2d").drawImage(img, 0, 0, photo.width, photo.height);
  URL.revokeObjectURL(url);

  muts.width = photo.width; muts.height = photo.height; setCanvasSize(photo.width, photo.height);
  $("funnyImg").removeAttribute("src");
  $("funnyImg").style.aspectRatio = `${photo.width} / ${photo.height}`;
  heads = []; hats = []; renderMuts();
  document.body.classList.add("has-photo");
  await new Promise(r => requestAnimationFrame(r));

  $("mutsBusy").hidden = false;
  detectReady = (async () => {
    try {
      heads = await findHeads(photo);
      placeHats();
      if (!heads.length) toast("No faces found 🙈");
    } catch (err) {
      console.error(err); toast("Face finder couldn't load");
    } finally { $("mutsBusy").hidden = true; }
  })();
  makeFunny();
}

$("file").addEventListener("change", e => { loadFile(e.target.files[0]); e.target.value = ""; });
const drop = $("drop");
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); loadFile(e.dataTransfer.files[0]); });
document.addEventListener("paste", e => {
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith("image/"));
  if (item) loadFile(item.getAsFile());
});
$("newPhoto").onclick = () => $("file").click();

// Warm up the face finder while the visitor is still picking a photo: starting the models
// briefly freezes the page, and we'd rather that not happen while the reindeer is eating.
const warmUp = () => (worker ? ask({ type: "warm" }) : loadDetectors()).catch(() => {});
if ("requestIdleCallback" in window) requestIdleCallback(warmUp, { timeout: 2500 }); else setTimeout(warmUp, 1200);
</script>
