[build]
  # prompts.md is the hand-editable source of all AI prompts; turn it into lib/prompts-data.mjs
  command = "node scripts/build-prompts.mjs"
  publish = "."
  functions = "netlify/functions"

# Hidden page: same app, Robin the robot joins every photo (no link to it anywhere)
[[redirects]]
  from = "/robin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/robin/"
  to = "/index.html"
  status = 200

# Hidden page: same app, everyone becomes a medieval knight (no link to it anywhere)
[[redirects]]
  from = "/ridder"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/ridder/"
  to = "/index.html"
  status = 200

# The QR codes in the watermark write the address in capitals (smaller code)
[[redirects]]
  from = "/ROBIN"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/RIDDER"
  to = "/index.html"
  status = 200
